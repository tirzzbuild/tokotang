<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deskripsi website kamu" />
    <title>Base HTML</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="container nav-wrap">
            <a href="#" class="logo">MyBrand</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Hero -->
    <section id="home" class="hero">
        <div class="container">
            <h1>Selamat Datang 👋</h1>
            <p>Ini base HTML yang siap kamu kembangkan.</p>
            <button id="btnClick" class="btn">Klik Saya</button>
        </div>
    </section>

    <!-- About -->
    <section id="about" class="section">
        <div class="container">
            <h2>About</h2>
            <p>Tulis deskripsi di sini.</p>
        </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="section">
        <div class="container">
            <h2>Contact</h2>
            <form id="contactForm">
                <input type="text" placeholder="Nama" required />
                <input type="email" placeholder="Email" required />
                <textarea placeholder="Pesan" rows="4" required></textarea>
                <button type="submit" class="btn">Kirim</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 MyBrand. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
